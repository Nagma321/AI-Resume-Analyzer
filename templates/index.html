<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>AI Resume Analyzer</title>

  <!-- Bootstrap CSS (CDN) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body class="bg-light">
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
      <a class="navbar-brand" href="/">AI Resume Analyzer</a>
      <div class="collapse navbar-collapse">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="/history">History</a></li>
          <li class="nav-item"><a class="nav-link" href="/compare">Compare Resumes</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="container py-5">
    <div class="card p-4 shadow">
      <h2 class="text-center mb-4">Upload Resume</h2>

      <form action="/analyze" method="POST" enctype="multipart/form-data">

  <!-- Resume upload only -->
  <div class="upload-box">
    <p><strong>Select your resume (PDF only)</strong></p>
    <input type="file" name="resume" accept="application/pdf" class="form-control" required>
  </div>

  <button class="btn btn-primary w-100 mt-3">Analyze Resume</button>
</form>


    </div>
  </div>
</body>
</html>
